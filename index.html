<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>آلبوم خاطرات بابا</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fbfbfa;
    color: #111;
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 22px 20px 8px;
    direction: ltr;
  }
  .brand {
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.02em;
    color: #111;
    white-space: nowrap;
  }
  .tab {
    background: #f0efec;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 0.95rem;
    color: #222;
    position: relative;
    white-space: nowrap;
  }
  .tab.active { background: #f0efec; }
  .tab sup { font-size: 0.6rem; margin-right: 3px; color: #555; }
  .tab.small {
    padding: 10px 14px;
    background: #f0efec;
    color: #333;
    font-size: 0.9rem;
  }

  .masonry {
    position: relative;
    padding: 28px 16px 60px;
    min-height: 60vh;
  }
  .masonry figure {
    position: absolute;
    top: 0; left: 0;
    margin: 0;
    overflow: hidden;
    border-radius: 3px;
    background: #f2f2f0;
    cursor: pointer;
    opacity: 0;
    transition: transform 1.1s cubic-bezier(.16,.9,.2,1), opacity .8s ease;
  }
  .masonry figure.ready { opacity: 1; }
  .masonry img {
    width: 100%;
    height: auto;
    display: block;
  }
  .masonry figure:active img { opacity: 0.85; }

  #modal {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(10,10,10,0.94);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .3s;
    padding: 20px;
  }
  #modal.active { opacity: 1; pointer-events: all; }
  #modal img {
    max-width: 92vw; max-height: 86vh;
    border-radius: 6px;
    box-shadow: 0 10px 50px rgba(0,0,0,0.5);
  }
  #modal .close-btn {
    position: fixed; top: 20px; left: 20px;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.12); color: #fff;
    border: none; font-size: 1.2rem; cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <div class="brand">آلبوم بابا</div>
  <div class="tab active">خاطرات خانواده <sup>۱</sup></div>
  <div class="tab small">۲</div>
  <div class="tab small">۳</div>
</header>

<div class="masonry" id="masonry"></div>

<div id="modal">
  <button class="close-btn" onclick="closeModal()">✕</button>
  <img id="modal-img" src="" alt="خاطره">
</div>

<script>
  const photoCount = 19;
  const grid = document.getElementById('masonry');
  const modal = document.getElementById('modal');
  const modalImg = document.getElementById('modal-img');
  const figures = [];

  const loaders = [];
  for (let i = 1; i <= photoCount; i++) {
    const src = `assets/photos/photo${String(i).padStart(2, '0')}.jpg`;
    const fig = document.createElement('figure');
    const img = document.createElement('img');
    img.src = src;
    img.alt = `خاطره ${i}`;
    img.loading = 'eager';
    fig.appendChild(img);
    fig.addEventListener('click', () => openModal(src));
    grid.appendChild(fig);
    figures.push(fig);

    loaders.push(new Promise((resolve) => {
      if (img.complete) resolve();
      else { img.onload = () => resolve(); img.onerror = () => resolve(); }
    }));
  }

  function layout() {
    const containerWidth = grid.clientWidth;
    const columns = window.innerWidth < 700 ? 2 : (window.innerWidth < 1100 ? 3 : 4);
    const gap = 14;
    const colWidth = (containerWidth - gap * (columns - 1)) / columns;
    const colHeights = new Array(columns).fill(0);
    const positions = [];

    figures.forEach((fig) => {
      const img = fig.querySelector('img');
      const naturalAspect = (img.naturalHeight && img.naturalWidth) ? (img.naturalHeight / img.naturalWidth) : 1.3;
      const h = colWidth * naturalAspect;
      let col = 0;
      let minH = colHeights[0];
      for (let c = 1; c < columns; c++) {
        if (colHeights[c] < minH) { minH = colHeights[c]; col = c; }
      }
      const x = col * (colWidth + gap);
      const y = colHeights[col];
      fig.style.width = colWidth + 'px';
      positions.push({ fig, x, y });
      colHeights[col] += h + gap;
    });

    grid.style.height = Math.max(...colHeights) + 'px';
    return positions;
  }

  Promise.all(loaders).then(() => {
    const positions = layout();
    const centerX = grid.clientWidth / 2 - 60;
    const centerY = grid.clientHeight ? grid.clientHeight / 2 : 260;

    // حالت اولیه: همه‌ی عکس‌ها کوچک و بهم‌فشرده وسط صفحه
    positions.forEach(({ fig }) => {
      fig.style.transitionDelay = '0ms';
      fig.style.transform = `translate(${centerX}px, ${centerY}px) scale(0.28)`;
    });

    // مجبور کردن مرورگر به رندر همین حالت (reflow) قبل از شروع ترنزیشن نهایی
    void grid.offsetHeight;

    setTimeout(() => {
      positions.forEach(({ fig, x, y }, i) => {
        fig.style.transitionDelay = (i * 28) + 'ms';
        fig.classList.add('ready');
        fig.style.transform = `translate(${x}px, ${y}px) scale(1)`;
      });
    }, 80);
  });

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const positions = layout();
      positions.forEach(({ fig, x, y }) => {
        fig.style.transitionDelay = '0ms';
        fig.style.transform = `translate(${x}px, ${y}px) scale(1)`;
      });
    }, 150);
  });

  function openModal(src) {
    modalImg.src = src;
    modal.classList.add('active');
  }
  function closeModal() {
    modal.classList.remove('active');
  }
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
  });
</script>

</body>
</html>
