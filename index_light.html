<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>آلبوم خاطرات بابا</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fbfbfa;
    color: #111;
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 22px 20px 8px;
    direction: ltr;
  }
  .brand {
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.02em;
    color: #111;
    white-space: nowrap;
  }
  .tab {
    background: #f0efec;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 0.95rem;
    color: #222;
    position: relative;
    white-space: nowrap;
  }
  .tab.active { background: #f0efec; }
  .tab sup { font-size: 0.6rem; margin-right: 3px; color: #555; }
  .tab.small {
    padding: 10px 14px;
    background: #f0efec;
    color: #333;
    font-size: 0.9rem;
  }

  .masonry {
    column-count: 2;
    column-gap: 14px;
    padding: 28px 16px 60px;
  }
  .masonry figure {
    break-inside: avoid;
    margin: 0 0 14px;
    overflow: hidden;
    border-radius: 3px;
    background: #f2f2f0;
    cursor: pointer;
  }
  .masonry img {
    width: 100%;
    height: auto;
    display: block;
    transition: transform .35s ease;
  }
  .masonry figure:active img { transform: scale(0.97); }

  /* آفست‌های پراکنده برای حس بورد خلاقانه */
  .masonry figure:nth-child(4n+2) { margin-top: 34px; }
  .masonry figure:nth-child(5n+3) { margin-top: 18px; }
  .masonry figure:nth-child(7n+1) { margin-top: 46px; }

  #modal {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(10,10,10,0.94);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .3s;
    padding: 20px;
  }
  #modal.active { opacity: 1; pointer-events: all; }
  #modal img {
    max-width: 92vw; max-height: 86vh;
    border-radius: 6px;
    box-shadow: 0 10px 50px rgba(0,0,0,0.5);
  }
  #modal .close-btn {
    position: fixed; top: 20px; left: 20px;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.12); color: #fff;
    border: none; font-size: 1.2rem; cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <div class="brand">آلبوم بابا</div>
  <div class="tab active">خاطرات خانواده <sup>۱</sup></div>
  <div class="tab small">۲</div>
  <div class="tab small">۳</div>
</header>

<div class="masonry" id="masonry"></div>

<div id="modal">
  <button class="close-btn" onclick="closeModal()">✕</button>
  <img id="modal-img" src="" alt="خاطره">
</div>

<script>
  const photoCount = 19;
  const grid = document.getElementById('masonry');
  const modal = document.getElementById('modal');
  const modalImg = document.getElementById('modal-img');

  for (let i = 1; i <= photoCount; i++) {
    const src = `assets/photos/photo${String(i).padStart(2, '0')}.jpg`;
    const fig = document.createElement('figure');
    fig.innerHTML = `<img src="${src}" loading="lazy" alt="خاطره ${i}">`;
    fig.addEventListener('click', () => openModal(src));
    grid.appendChild(fig);
  }

  function openModal(src) {
    modalImg.src = src;
    modal.classList.add('active');
  }
  function closeModal() {
    modal.classList.remove('active');
  }
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
  });
</script>

</body>
</html>
